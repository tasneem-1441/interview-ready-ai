<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Brain Circuit Emblem -->
  <g filter="url(#glow)" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left lobe -->
    <path d="M 28 17 C 22 17 18 21 18 26 C 18 28.5 19 30.5 20.5 32 C 18 34 18 38 20 41 C 22 44 25 46 28 46"/>
    <!-- Right lobe -->
    <path d="M 36 17 C 42 17 46 21 46 26 C 46 28.5 45 30.5 43.5 32 C 46 34 46 38 44 41 C 42 44 39 46 36 46"/>
    <!-- Center divider -->
    <path d="M 32 18 L 32 46"/>
    
    <!-- Neural Circuit Traces & Nodes -->
    <path d="M 24 25 L 32 25"/>
    <path d="M 40 25 L 32 25"/>
    <path d="M 22 34 L 32 34"/>
    <path d="M 42 34 L 32 34"/>
    <path d="M 25 41 L 32 41"/>
    <path d="M 39 41 L 32 41"/>
  </g>

  <!-- Circuit Connection Dots -->
  <circle cx="24" cy="25" r="2" fill="#ffffff"/>
  <circle cx="40" cy="25" r="2" fill="#ffffff"/>
  <circle cx="22" cy="34" r="2" fill="#ffffff"/>
  <circle cx="42" cy="34" r="2" fill="#ffffff"/>
  <circle cx="25" cy="41" r="2" fill="#ffffff"/>
  <circle cx="39" cy="41" r="2" fill="#ffffff"/>
  <circle cx="32" cy="18" r="2.2" fill="#ffffff"/>
  <circle cx="32" cy="32" r="2.5" fill="#38bdf8"/>
  <circle cx="32" cy="46" r="2.2" fill="#ffffff"/>
</svg>
